[package]
name = "kazoo-sampler"
version = "0.3.3"
edition = "2024"
rust-version = "1.89"
description = "Kazoo's sampler: record your own sounds, keep them, play them back beautifully"
license = "AGPL-3.0-or-later"
publish = false

[lints]
workspace = true

[dependencies]
hound = "3.5.1"
kazoo-fx = { path = "../kazoo-fx", version = "=0.3.3" }
ringbuf = "0.4.8"

[dev-dependencies]
assert_no_alloc = "1.1.2"
tempfile = "3"
