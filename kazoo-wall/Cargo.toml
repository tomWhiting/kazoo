[package]
name = "kazoo-wall"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The wall: a shared modular synth that never stops"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "0.1.0" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
color-eyre = "0.6.5"
cpal = "0.17.1"
crossterm = "0.29.0"
hound = "3.5.1"
kazoo-core = { path = "../kazoo-core", version = "0.1.0" }
kazoo-fx = { path = "../kazoo-fx", version = "0.1.0" }
kazoo-perc = { path = "../kazoo-perc", version = "0.1.0" }
kazoo-speech = { path = "../kazoo-speech", version = "0.1.0" }
ratatui = "0.30.0"
ringbuf = "0.4.8"
# Already in the tree through crossterm: a plain fsync, without unsafe
# code here, where std's sync_all is a full flush (F_FULLFSYNC) on macOS.
rustix = { version = "1.1.3", features = ["fs", "time"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
signal-hook = "0.3.18"
toml = "0.9"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
tempfile = "3"

[[bench]]
name = "wall_render"
harness = false

[[bench]]
name = "control"
harness = false
