[package]
name = "kazoo-arp"
version = "0.3.3"
edition = "2024"
rust-version = "1.89"
description = "Jupiter-8 style arpeggiator — note scheduler for any synth"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "=0.3.3" }
kazoo-core = { version = "=0.3.3", path = "../kazoo-core" }
cpal = "0.17"
crossbeam-channel = "0.5"
crossterm = "0.29"
ratatui = "0.30"
color-eyre = "0.6"
ringbuf = "0.4"

[dev-dependencies]
tempfile = "3"
