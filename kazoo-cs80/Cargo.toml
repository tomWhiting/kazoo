[package]
name = "kazoo-cs80"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Yamaha CS-80 inspired pad synth — 8-voice polyphonic, dual-layer"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "=0.2.0" }
kazoo-core = { version = "=0.2.0", path = "../kazoo-core" }
cpal = "0.17"
crossbeam-channel = "0.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
color-eyre = "0.6.5"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
