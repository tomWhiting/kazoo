[package]
name = "kazoo-glass"
version = "0.3.3"
edition = "2024"
rust-version = "1.89"
description = "Polyphonic modal bell synthesizer: tuned glass, chimes and metallic keys"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "=0.3.3" }
kazoo-core = { version = "=0.3.3", path = "../kazoo-core" }
color-eyre = "0.6.5"
cpal = "0.17"
crossbeam-channel = "0.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
hound = "3.5.1"

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
