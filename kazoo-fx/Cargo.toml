[package]
name = "kazoo-fx"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Kazoo's effects, written from scratch: drive, time and space"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
assert_no_alloc = "1.1.2"

[[bench]]
name = "circuit_models"
harness = false

[[bench]]
name = "models"
harness = false
