[package]
name = "kazoo-tree"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "The wall's tree: every moment it has been, grown as a tree you can walk"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
kazoo-host = { path = "../kazoo-host", version = "=0.2.1" }
kazoo-wall = { path = "../kazoo-wall", version = "=0.2.1" }
libm = "0.2.16"
ratatui = "0.30.0"
rustix = { version = "1.1.3", features = ["fs"] }
serde_json = "1.0.149"
signal-hook = "0.3.18"
toml = "0.9"
unicode-segmentation = "1.12.0"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"
