[package]
name = "kazoo-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The kazoo mouth synth console: voice-driven synthesis in the terminal"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "0.1.0" }
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3"
kazoo-core = { version = "0.1.0", path = "../kazoo-core" }
ratatui = "0.30.0"
tokio = { version = "1.49.0", features = ["full"] }

[dev-dependencies]
crossbeam-channel = "0.5"
