[package]
name = "kazoo-808"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "TR-808 drum machine — all-synthesis, no samples"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "=0.2.1" }
kazoo-core = { version = "=0.2.1", path = "../kazoo-core" }
cpal = "0.17.1"
crossbeam-channel = "0.5.15"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
color-eyre = "0.6.5"
rand = "0.9"
