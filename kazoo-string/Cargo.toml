[package]
name = "kazoo-string"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
description = "Plucked-string physical-model synth: Karplus-Strong waveguides with stiffness, pick position and a wooden body"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "=0.2.1" }
kazoo-core = { version = "=0.2.1", path = "../kazoo-core" }
color-eyre = "0.6.5"
cpal = "0.17"
crossbeam-channel = "0.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
