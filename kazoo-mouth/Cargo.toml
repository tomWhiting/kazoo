[package]
name = "kazoo-mouth"
version = "0.1.0"
edition = "2024"
description = "The mouth: a voice synth and voice source for the desk"

[lints]
workspace = true

[dependencies]
kazoo-core = { path = "../kazoo-core" }
kazoo-host = { path = "../kazoo-host" }
crossbeam-channel = "0.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
color-eyre = "0.6.5"
ringbuf = "0.4.8"

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
hound = "3.5.1"
