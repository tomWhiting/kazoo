[package]
name = "kazoo-speech"
version = "0.3.3"
edition = "2024"
rust-version = "1.89"
description = "Kazoo's studio vocoder, text-to-speech renderer and phrase player"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-fx = { path = "../kazoo-fx", version = "=0.3.3" }
hound = "3.5"
ringbuf = "0.4.8"

[dev-dependencies]
assert_no_alloc = "1.1.2"
