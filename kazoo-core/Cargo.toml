[package]
name = "kazoo-core"
version = "0.3.1"
edition = "2024"
rust-version = "1.89"
description = "The kazoo audio library: synthesis, effects, analysis and the studio link, with no UI"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
# MPL-2.0 (Mozilla), file-level copyleft: used unmodified from crates.io,
# where its source is published; changes to its own files would have to be
# published under the MPL too. Without default features it leaves out D-Bus.
audio_thread_priority = { version = "0.38.0", default-features = false }
audioadapter-buffers = "2.0.0"
cpal = "0.17.1"
crossbeam-channel = "0.5.15"
dasp_sample = "0.11.0"
fundsp = "0.23.0"
hound = "3.5.1"
midir = "0.10.3"
num-complex = "0.4.6"
ringbuf = "0.4.8"
realfft = "3.5.0"
rubato = "1.0.1"
rustfft = "6.4.1"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10"
symphonia = "0.5.5"
thiserror = "2.0.18"

[dev-dependencies]
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
tempfile = "3"

[[bench]]
name = "link_path"
harness = false

[[bench]]
name = "voice"
harness = false
