[package]
name = "kazoo-mix"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "The kazoo desk: the studio hub every instrument plays into, with its mixer"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "=0.2.0" }
color-eyre = "0.6.5"
cpal = "0.17.1"
crossterm = "0.29.0"
kazoo-core = { path = "../kazoo-core", version = "=0.2.0" }
kazoo-808 = { path = "../kazoo-808", version = "=0.2.0" }
ratatui = "0.30.0"
ringbuf = "0.4.8"
rustix = { version = "1.1.3", features = ["event"] }

[dev-dependencies]
assert_no_alloc = { version = "1.1.2", features = ["warn_debug"] }
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }
tempfile = "3"

[[bench]]
name = "desk_callback"
harness = false
