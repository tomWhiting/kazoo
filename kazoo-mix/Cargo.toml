[package]
name = "kazoo-mix"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[lints]
workspace = true

[dependencies]
kazoo-host = { path = "../kazoo-host" }
color-eyre = "0.6.5"
cpal = "0.17.1"
crossterm = "0.29.0"
kazoo-core = { path = "../kazoo-core" }
kazoo-808 = { path = "../kazoo-808" }
ratatui = "0.30.0"
ringbuf = "0.4.8"
rustix = { version = "1.1.3", features = ["event"] }

[dev-dependencies]
assert_no_alloc = "1.1.2"
criterion = { version = "0.5.1", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "desk_callback"
harness = false
