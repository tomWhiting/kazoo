[package]
name = "kzoo"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "The kazoo studio in one command: the desk, the wall, the seat and every instrument"
license = "AGPL-3.0-or-later"
repository = "https://github.com/tomWhiting/kazoo"
readme = "../README.md"
keywords = ["synthesizer", "audio", "music", "modular", "terminal"]
categories = ["multimedia::audio", "command-line-utilities"]

[lints]
workspace = true

# The library keeps the name the code has always used.
[lib]
name = "kazoo"

# One program by two names: `kzoo`, its public name, and `kazoo`.
[[bin]]
name = "kzoo"
path = "src/bin/kzoo.rs"

[[bin]]
name = "kazoo"
path = "src/bin/kazoo.rs"

[dependencies]
kazoo-host = { path = "../kazoo-host", version = "0.1.0" }
clap = { version = "4.5", features = ["derive", "env"] }
color-eyre = "0.6.5"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
kazoo-core = { path = "../kazoo-core", version = "0.1.0" }
kazoo-mix = { path = "../kazoo-mix", version = "0.1.0" }
kazoo-wall = { path = "../kazoo-wall", version = "0.1.0" }
kazoo-mcp = { path = "../kazoo-mcp", version = "0.1.0" }
kazoo-808 = { path = "../kazoo-808", version = "0.1.0" }
kazoo-303 = { path = "../kazoo-303", version = "0.1.0" }
kazoo-cs80 = { path = "../kazoo-cs80", version = "0.1.0" }
kazoo-mini = { path = "../kazoo-mini", version = "0.1.0" }
kazoo-juno = { path = "../kazoo-juno", version = "0.1.0" }
kazoo-prophet = { path = "../kazoo-prophet", version = "0.1.0" }
kazoo-dx = { path = "../kazoo-dx", version = "0.1.0" }
kazoo-string = { path = "../kazoo-string", version = "0.1.0" }
kazoo-glass = { path = "../kazoo-glass", version = "0.1.0" }
kazoo-arp = { path = "../kazoo-arp", version = "0.1.0" }
kazoo-play = { path = "../kazoo-play", version = "0.1.0" }
kazoo-tui = { path = "../kazoo-tui", version = "0.1.0" }
kazoo-mouth = { path = "../kazoo-mouth", version = "0.1.0" }
kazoo-tree = { path = "../kazoo-tree", version = "0.1.0" }
